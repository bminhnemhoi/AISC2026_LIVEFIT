# LiveLift CI — quality gates from HARNESS.md §2.
# Red CI = no merge, no exceptions.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly slow suite (statistical validation on simulation).
    # 18:00 UTC = 01:00 Asia/Ho_Chi_Minh.
    - cron: "0 18 * * *"
  workflow_dispatch:

jobs:
  lint:
    name: ruff lint + format
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install ruff
        run: pip install ruff
      - name: ruff check
        run: ruff check src tests
      - name: ruff format --check
        run: ruff format --check src tests

  test:
    name: original research pytest (fast) + coverage
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev extras
        run: pip install -e ".[dev,server,ml]"
      - name: Run fast test suite
        run: pytest -m "not slow" --cov=src/livelift --cov-report=term

  isolation:
    name: VLiveBench isolation gate
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check src/ <-> collectors/ import isolation
        run: python scripts/check_isolation.py

  web:
    name: original research web build (Next.js 14)
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    continue-on-error: false
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build

  product:
    name: current LiveLift product (Next.js 16)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: next
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.3"
          cache: npm
          cache-dependency-path: next/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint
        run: npm run lint
      # Unit/component tests; live-server cases retain their existing prerequisites.
      # Full browser certification is a separate acceptance run.
      - name: Unit and component tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          LIVELIFT_APP_ORIGIN: https://livelift-ci.invalid
          LIVELIFT_WORKSPACE_ID: 00000000-0000-4000-8000-000000000001
          LIVELIFT_ROOM_ID: ci-room
          LIVELIFT_DB_PATH: ${{ runner.temp }}/livelift-ci/authority.sqlite
          LIVELIFT_BACKUP_DIR: ${{ runner.temp }}/livelift-ci/backups
          LIVELIFT_INTELLIGENCE_MODE: "off"
      - name: Audit production dependencies
        run: npm audit --omit=dev

  nightly:
    name: original research pytest (slow statistical validation)
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install package with dev extras
        run: pip install -e ".[dev,server,ml]"
      - name: Run slow suite (estimator validation on simulation)
        run: pytest -m slow
