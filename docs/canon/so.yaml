# Bộ số chuẩn của LiveLift (AISC'26, đội AISC26-0039)
#
# Đây là nguồn chuẩn cho mọi con số xuất hiện trên deck, poster, kịch bản, hỏi đáp,
# README và giao diện. Số mới phải vào docs/competition/FACT-SHEET.md trước, rồi mới
# vào tệp này, rồi mới đi ra nơi khác. Không bao giờ sửa theo chiều ngược lại.
#
# Lập 19/10/2026. Các số mô phỏng đã đối chiếu lại với JSON nguồn cùng ngày.
#
# Trường của mỗi số:
#   id          khoá ngắn, không dấu, dùng trong mã (so_lieu.py, kiem_so.py)
#   gia_tri     giá trị máy đọc (tỷ lệ để dạng 0..1; số tiền để nguyên đơn vị)
#   hien_thi    cách viết đúng trên bản tiếng Việt (dấu phẩy thập phân, dấu chấm hàng nghìn)
#   nhan        MÔ PHỎNG · DÀN DỰNG · THẬT · GIẢ THUYẾT · THỨ CẤP · NHÃN AI · QUAN SÁT ·
#               MINH HOẠ · MÀN MẪU · THỬ NỘI BỘ
#   nguon_tep   tệp sinh ra hoặc ghi số (đường dẫn tính từ gốc repo livelift/, hoặc URL)
#   nguon_khoa  khoá JSON hoặc dòng bảng để đối chiếu
#   duoc_noi    câu mẫu được phép nói (có thể rút gọn, không được bỏ điều kiện)
#   cam         biểu thức chính quy của cách nói bị cấm (Python re, không phân biệt hoa thường)
#   ngay_do     ngày đo hoặc ngày kiểm nguồn (YYYY-MM-DD)

phien_ban: "2026-10-19"
fact_sheet: docs/competition/FACT-SHEET.md

