  - id: bao_nham_tb
    gia_tri: 0.043
    hien_thi: "4,3%"
    nhan: MÔ PHỎNG
    nguon_tep: docs/benchmarks/data/liveroom-grid/R200-P120/
    nguon_khoa: "trung bình by_burn_in/60/rejection_rate trên 12 tệp clicks_tau0_*.json (0,0429)"
    duoc_noi: "Trong 12 kịch bản mô phỏng không có tác động, phép đo báo nhầm trung bình 4,3% (mức cho phép 5%)."
    cam:
      - '≈\s*4\s*%'
      - 'luôn đúng 5\s*%'
      - '4,5\s*%'
    ngay_do: "2026-10-15"
    ghi_chu: "Số tiêu đề của phần bằng chứng phương pháp. A/A 3,50% chỉ ở chú thích."

