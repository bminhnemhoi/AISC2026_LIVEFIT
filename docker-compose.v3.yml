name: livelift-v3
services:
  caddy:
    image: caddy:2.10.2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      LIVELIFT_HOST: ${LIVELIFT_HOST:?set public HTTPS hostname}
    volumes:
      - ./docker/next.Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks: [edge, app]
    depends_on:
      next:
        condition: service_healthy
  next:
    build:
      context: ./next
      dockerfile: ../docker/next.Dockerfile
      args:
        APP_COMMIT: ${LIVELIFT_APP_COMMIT:-unknown}
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    user: "1000:1000"
    environment:
      NODE_ENV: production
      LIVELIFT_APP_ORIGIN: ${LIVELIFT_APP_ORIGIN:?set exact HTTPS origin}
      LIVELIFT_WORKSPACE_ID: ${LIVELIFT_WORKSPACE_ID:?set installation UUID}
      LIVELIFT_ROOM_ID: ${LIVELIFT_ROOM_ID:?set room identity}
      LIVELIFT_DB_PATH: /var/lib/livelift/authority.sqlite
      LIVELIFT_BACKUP_DIR: /var/backups/livelift
      LIVELIFT_TRUST_PROXY: caddy
      LIVELIFT_APP_COMMIT: ${LIVELIFT_APP_COMMIT:-unknown}
      # Optional TikTok Login Kit (docs/tiktok/SANDBOX-SETUP.md). Empty keeps TikTok "Not configured".
      LIVELIFT_TIKTOK_CLIENT_KEY: ${LIVELIFT_TIKTOK_CLIENT_KEY:-}
      LIVELIFT_TIKTOK_CLIENT_SECRET: ${LIVELIFT_TIKTOK_CLIENT_SECRET:-}
      LIVELIFT_TIKTOK_REDIRECT_URI: ${LIVELIFT_TIKTOK_REDIRECT_URI:-}
      LIVELIFT_PROVIDER_ENCRYPTION_KEY: ${LIVELIFT_PROVIDER_ENCRYPTION_KEY:-}
      LIVELIFT_TIKTOK_SCOPES: ${LIVELIFT_TIKTOK_SCOPES:-}
      # Optional AI Copilot (docs/ai/COPILOT.md). Empty keeps the Copilot "Not configured". Server-side only.
      LIVELIFT_AI_BASE_URL: ${LIVELIFT_AI_BASE_URL:-}
      LIVELIFT_AI_API_KEY: ${LIVELIFT_AI_API_KEY:-}
      LIVELIFT_AI_MODEL: ${LIVELIFT_AI_MODEL:-}
      LIVELIFT_AI_TIMEOUT_MS: ${LIVELIFT_AI_TIMEOUT_MS:-}
      LIVELIFT_AI_MAX_OUTPUT_TOKENS: ${LIVELIFT_AI_MAX_OUTPUT_TOKENS:-}
      LIVELIFT_AI_JSON_MODE: ${LIVELIFT_AI_JSON_MODE:-}
    volumes:
      - authority:/var/lib/livelift
      - backups:/var/backups/livelift
    networks: [app]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    deploy:
      replicas: 1
      resources:
        limits:
          memory: 1G
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/readyz').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
volumes:
  authority:
  backups:
  caddy_data:
  caddy_config:
networks:
  edge:
  app:
    internal: true
